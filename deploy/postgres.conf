# Postgres on the VPS: 8 GB RAM shared with the app, 20 GB disk. Only the Compose network reaches it.
listen_addresses = '*'
max_connections = 60
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_wal_size = 512MB
min_wal_size = 80MB
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
