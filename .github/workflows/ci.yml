name: CI

# lint -> typecheck -> test + coverage -> build, then security scans. Nothing here deploys:
# Vercel builds previews for pull requests and production from main (see docs/standards/delivery.md).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saqinadev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/saqinadev_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the coverage check compares against the base branch.
          fetch-depth: 0

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare the test database
        run: |
          printf 'DATABASE_URL_TEST=%s\n' "$DATABASE_URL_TEST" > .env.local
          pnpm db:migrate --test

      - name: Test (with coverage when the provider is installed)
        run: |
          if [ -d node_modules/@vitest/coverage-v8 ]; then
            pnpm test:coverage
          else
            echo "::warning::@vitest/coverage-v8 is not installed: running tests without coverage"
            pnpm test
          fi

      - name: Coverage of new and changed files
        if: github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: pnpm check:coverage

      - name: Build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Throwaway values: the build only needs them to exist; nothing here is a real secret.
          BETTER_AUTH_SECRET: ci-build-only-secret-0123456789abcdef0123456789
          SAQINA_ENCRYPTION_KEY: dGVzdC1vbmx5LWtleS1kby1ub3QtdXNlLWFueXdoZXI=
        run: pnpm build

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/lcov.info') != ''
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Dependency licences
        run: pnpm check:licenses

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (OSS rules, fails on findings)
        run: semgrep scan --config p/default --config p/typescript --config p/react --error --metrics off src
