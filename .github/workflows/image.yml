name: Image

# Builds the production image for the VPS and pushes it to GHCR, tagged by commit and as `main`.
# Deploying it is a separate, manual step on the server (deploy/deploy.sh, docs/runbook.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          # The public pages are prerendered from the database (a read-only role, docs/runbook.md).
          secrets: database_url=${{ secrets.BUILD_DATABASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
