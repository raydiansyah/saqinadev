name: Image

# Builds the production image for the VPS and pushes it to GHCR, tagged by commit and as `main`.
# Deploying it is a separate, manual step on the server (deploy/deploy.sh, docs/runbook.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_ values are fixed into the bundles at build time (repository variables).
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # The public pages are prerendered from the database (a read-only role, docs/runbook.md).
          secrets: database_url=${{ secrets.BUILD_DATABASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Easypanel pulls the freshly pushed GHCR image; the URL is stored as an Actions secret.
      # Configure EASYPANEL_DEPLOY_URL only after switching the Easypanel service source to GHCR.
      - name: Trigger Easypanel deployment
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::notice::EASYPANEL_DEPLOY_URL is not configured; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$EASYPANEL_DEPLOY_URL"
