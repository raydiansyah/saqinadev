version: 2

# Weekly update pull requests. Security updates open immediately regardless of this schedule.
# Each one goes through the same pipeline and review as any other change (docs/standards/delivery.md).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      # TypeScript 7 is the native compiler and no longer ships the JavaScript compiler API that
      # src/lib/memory/code/parse.ts uses as its parser. Revisit when that code moves to another
      # parser or TypeScript offers the API again.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
